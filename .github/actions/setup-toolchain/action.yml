name: setup-toolchain
description: >-
  FONDACO CI toolchain with pinned versions and caches (versions in tools/ci/toolchain.json): Node from .nvmrc, pnpm from
  package.json packageManager (pnpm install --frozen-lockfile), and optionally Foundry v1.5.1, solc 0.8.23 (checksum),
  Playwright Chromium, Docker Buildx, kubo (CID only, no node), gitleaks. The downloaded binaries come from
  tools/ci/fetch-binary.mjs: Actions cache keyed name + version + checksum, primary then fallback source, the checksum is
  the only authority (D-64). Ends by printing every version and failing on a mismatch.
inputs:
  foundry: { description: install forge/anvil/cast, default: "false" }
  solc: { description: download solc 0.8.23 for tools/verify-source (checksum verified), default: "false" }
  playwright: { description: "\"true\": install Playwright Chromium (and its system deps); \"image\": already in the job container (the pinned Playwright image)", default: "false" }
  docker: { description: set up Docker Buildx, default: "false" }
  kubo: { description: install the kubo (ipfs) CLI, default: "false" }
  gitleaks: { description: install gitleaks, default: "false" }
runs:
  using: composite
  steps:
    - name: pnpm (version from package.json packageManager)
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
    - name: Node (version from .nvmrc), pnpm store cache
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with: { node-version-file: .nvmrc, cache: pnpm }
    - name: pnpm install --frozen-lockfile
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: cache keys of the pinned binaries (name + version + checksum)
      id: bin
      shell: bash
      run: node tools/ci/fetch-binary.mjs --keys >> "$GITHUB_OUTPUT"

    - name: Foundry cache
      if: inputs.foundry == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with: { path: .cache/bin/foundry, key: "${{ steps.bin.outputs.foundry }}" }
    - name: Foundry v1.5.1 (fixed release, checksum verified; download only on a cache miss, fallback after the primary)
      if: inputs.foundry == 'true'
      shell: bash
      run: |
        set -euo pipefail
        f=$(node tools/ci/fetch-binary.mjs foundry)
        mkdir -p "$HOME/.foundry/bin"; tar xzf "$f" -C "$HOME/.foundry/bin"; echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
      env: { GITHUB_TOKEN: "${{ github.token }}" }
    - name: Foundry RPC cache (forked state, as foundry-toolchain kept it)
      if: inputs.foundry == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.foundry/cache/rpc
        key: "foundry-rpc-${{ runner.os }}-${{ github.job }}-${{ github.sha }}"
        restore-keys: "foundry-rpc-${{ runner.os }}-${{ github.job }}-"

    - name: solc cache
      if: inputs.solc == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: .cache/verify-source
        key: "verify-source-solc-0.8.23-${{ hashFiles('packages/contracts/compiler-settings.json') }}"
    - name: solc binary cache
      if: inputs.solc == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with: { path: .cache/bin/solc, key: "${{ steps.bin.outputs.solc }}" }
    - name: solc 0.8.23 (checksum verified; download only on a cache miss, fallback after the primary)
      if: inputs.solc == 'true'
      shell: bash
      run: |
        set -euo pipefail
        build=$(node -p "require('./tools/ci/toolchain.json').solc.build"); f=$(node tools/ci/fetch-binary.mjs solc)
        mkdir -p .cache/verify-source; cp "$f" ".cache/verify-source/$build"; chmod +x ".cache/verify-source/$build"

    - name: Playwright browsers from the image (CHROME_PATH for Lighthouse)
      if: inputs.playwright == 'image'
      shell: bash
      run: echo "CHROME_PATH=$(cd apps/web && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
    - name: Playwright browsers cache
      if: inputs.playwright == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/ms-playwright
        key: "playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
    - name: Playwright Chromium (+ system dependencies), CHROME_PATH for Lighthouse
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        pnpm --filter @fondaco/web exec playwright install --with-deps chromium
        echo "CHROME_PATH=$(cd apps/web && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

    - name: Docker Buildx
      if: inputs.docker == 'true'
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: kubo cache
      if: inputs.kubo == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with: { path: .cache/bin/kubo, key: "${{ steps.bin.outputs.kubo }}" }
    - name: kubo (ipfs CLI, checksum verified; download only on a cache miss, fallback after the primary)
      if: inputs.kubo == 'true'
      shell: bash
      run: |
        set -euo pipefail
        f=$(node tools/ci/fetch-binary.mjs kubo)
        mkdir -p "$HOME/.local/bin"; tar xzf "$f" -C /tmp; cp /tmp/kubo/ipfs "$HOME/.local/bin/ipfs"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: gitleaks cache
      if: inputs.gitleaks == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with: { path: .cache/bin/gitleaks, key: "${{ steps.bin.outputs.gitleaks }}" }
    - name: gitleaks (checksum verified; download only on a cache miss, fallback after the primary)
      if: inputs.gitleaks == 'true'
      shell: bash
      run: |
        set -euo pipefail
        f=$(node tools/ci/fetch-binary.mjs gitleaks)
        mkdir -p "$HOME/.local/bin"; tar xzf "$f" -C "$HOME/.local/bin" gitleaks; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      env: { GITHUB_TOKEN: "${{ github.token }}" }

    - name: Versions (fail on mismatch)
      shell: bash
      run: |
        need=""
        [ "${{ inputs.foundry }}" = true ] && need="$need,foundry"
        [ "${{ inputs.solc }}" = true ] && need="$need,solc"
        [ "${{ inputs.playwright }}" != false ] && need="$need,playwright"
        [ "${{ inputs.docker }}" = true ] && need="$need,docker"
        [ "${{ inputs.kubo }}" = true ] && need="$need,kubo"
        [ "${{ inputs.gitleaks }}" = true ] && need="$need,gitleaks"
        node tools/ci/versions.mjs --need "${need#,}"
