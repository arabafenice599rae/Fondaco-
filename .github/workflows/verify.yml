# FONDACO verification. Four ways to run it:
#   pull_request        quick profile (slow suites skipped, Foundry ci-quick profile, public fork RPC with retries)
#   schedule (nightly)  full profile
#   push of a v* tag    full profile, then the image is published (docker-publish)
#   workflow_dispatch   by hand: Actions → verify → Run workflow, or  gh workflow run verify.yml -f suite=full [-f fork_block=…] [-f ref=…]
# Secrets: FORK_RPC_URL (archive mainnet RPC, used by the nightly and manual runs; without it a public RPC is used with
# 3 retries per fork suite), BASE_RPC_URL (optional, verify-source step 7). Every job writes its table to the run summary.
name: verify

on:
  pull_request:
  push:
    tags: ["v*"]          # releases: full profile, then docker-publish
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: what to verify
        type: choice
        options: [full, quick, contracts, book-server, client, web]
        default: full
      fork_block:
        description: mainnet block to fork
        default: "23700000"
      ref:
        description: branch, tag or commit to verify (empty = the selected branch)
        default: ""

permissions:
  contents: read

# One group per workflow + event + ref; manual and nightly runs get their own run id, so a manual run never cancels another
# manual run or the nightly. Only pull_request and push runs replace an older run of the same ref (a newer commit).
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || (github.event_name == 'pull_request' && github.head_ref || github.ref) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORK_BLOCK: ${{ inputs.fork_block || '23700000' }}
  REF: ${{ inputs.ref || github.sha }}

jobs:
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      lint: ${{ steps.plan.outputs.lint }}
      unit: ${{ steps.plan.outputs.unit }}
      fork: ${{ steps.plan.outputs.fork }}
      foundry: ${{ steps.plan.outputs.foundry }}
      web: ${{ steps.plan.outputs.web }}
      supply: ${{ steps.plan.outputs.supply }}
      repro: ${{ steps.plan.outputs.repro }}
      docker: ${{ steps.plan.outputs.docker }}
      groups: ${{ steps.plan.outputs.groups }}
      retries: ${{ steps.plan.outputs.retries }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}", submodules: recursive }
      - name: plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          HAS_RPC: ${{ secrets.FORK_RPC_URL != '' }}
        run: |
          s="$SUITE"; [ "$EVENT" = pull_request ] && s=quick; [ "$EVENT" = schedule ] && s=full; [ "$EVENT" = push ] && s=full
          prof=full; [ "$s" = quick ] && prof=quick
          all() { for k in lint unit fork foundry web supply repro docker; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; }
          case "$s" in
            full|quick) all true; groups="contracts,book-server,client,tools" ;;
            contracts)   all false; for k in lint unit fork foundry supply; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; groups=contracts ;;
            book-server) all false; for k in lint unit fork docker; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; groups=book-server ;;
            client)      all false; for k in lint unit fork; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; groups=client ;;
            web)         all false; for k in lint web repro; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; groups=web ;;
          esac
          retries=0; [ "$HAS_RPC" != true ] && retries=3
          { echo "profile=$prof"; echo "groups=$groups"; echo "retries=$retries"; } >> "$GITHUB_OUTPUT"
          { echo "### Plan"; echo; echo "| event | suite | profile | groups | fork block | fork RPC | ref |"; echo "|---|---|---|---|---|---|---|";
            echo "| $EVENT | $s | $prof | $groups | $FORK_BLOCK | $([ "$HAS_RPC" = true ] && echo 'secret FORK_RPC_URL' || echo 'public, 3 retries') | $REF |"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: toolchain (warms the caches the other jobs reuse)
        uses: ./.github/actions/setup-toolchain
        with: { foundry: "true", solc: "true", playwright: "true", docker: "true", kubo: "true", gitleaks: "true" }

  lint:
    needs: toolchain
    if: needs.toolchain.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:generated
      - run: node tools/testkit/run-suites.mjs lint checksums --report lint

  unit:
    needs: toolchain
    if: needs.toolchain.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAINNET_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://eth.drpc.org' }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
        with: { solc: "true" }
      - run: pnpm build
      - name: unit suites (book-server, client, contracts incl. verify-source vs the AirSwap deployment)
        run: node tools/testkit/run-suites.mjs --unit --group ${{ needs.toolchain.outputs.groups }} --skip lint,checksums --report unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-unit, path: reports/, if-no-files-found: ignore }

  fork:
    needs: toolchain
    if: needs.toolchain.outputs.fork == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAINNET_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://eth.drpc.org' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
        with: { foundry: "true" }
      - run: pnpm build
      - name: fork suites (anvil at the fixed block, one fresh fork per suite)
        run: >-
          node tools/testkit/run-suites.mjs --fork --group ${{ needs.toolchain.outputs.groups }} --skip foundry
          --retries ${{ needs.toolchain.outputs.retries }} ${{ needs.toolchain.outputs.profile == 'quick' && '--profile quick' || '' }} --report fork
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-fork, path: reports/, if-no-files-found: ignore }

  foundry:
    needs: toolchain
    if: needs.toolchain.outputs.foundry == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAINNET_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://eth.drpc.org' }}
      FOUNDRY_PROFILE: ${{ needs.toolchain.outputs.profile == 'quick' && 'ci-quick' || 'default' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}", submodules: recursive }
      - uses: ./.github/actions/setup-toolchain
        with: { foundry: "true" }
      - name: forge test (${{ env.FOUNDRY_PROFILE }} profile)
        run: node tools/testkit/run-suites.mjs foundry --retries ${{ needs.toolchain.outputs.retries }} --report foundry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-foundry, path: reports/, if-no-files-found: ignore }

  web-e2e:
    needs: toolchain
    if: needs.toolchain.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # the official Playwright image, pinned by version and digest (= tools/ci/toolchain.json playwrightImage.ref, checked by
    # versions.mjs): the visual baselines are generated in the same image (tools/testkit/in-playwright.mjs), D-54
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    env:
      MAINNET_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://eth.drpc.org' }}
      FONDACO_PW_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
        with: { foundry: "true", playwright: image }
      - run: pnpm build
      - name: web suites (model, keys, layout, a11y, visual, e2e, flows, Lighthouse)
        run: >-
          node tools/testkit/run-suites.mjs --group web --skip reproducible-build
          --retries ${{ needs.toolchain.outputs.retries }} --report web
      - name: screenshots (demo build, 390 and 1440)
        if: always()
        run: node apps/web/scripts/screenshots.mjs reports/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-web, path: reports/, if-no-files-found: ignore }

  # nightly and manual runs only: every source of every pinned binary must give its checksum (D-64). Its own job, so a broken
  # fallback turns the run red without stopping the toolchain job from saving the caches; nothing else depends on it.
  toolchain-sources:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: every source of every pinned binary gives its checksum (primary and fallbacks)
        run: node tools/ci/fetch-binary.mjs --check-sources
        env: { GITHUB_TOKEN: "${{ github.token }}" }

  supply-chain:
    needs: toolchain
    if: needs.toolchain.outputs.supply == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}", fetch-depth: 0 }
      - uses: ./.github/actions/setup-toolchain
        with: { gitleaks: "true" }
      - name: pnpm audit (fails on high/critical)
        run: |
          pnpm audit --json > reports-audit.json || true
          node -e "const m=require('./reports-audit.json').metadata.vulnerabilities; console.log(m); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### pnpm audit\n\n| critical | high | moderate | low |\n|---|---|---|---|\n| '+[m.critical,m.high,m.moderate,m.low].join(' | ')+' |\n\n'); process.exit(m.critical+m.high ? 1 : 0)"
      - name: lockfile is frozen (install did not change it)
        run: git diff --exit-code pnpm-lock.yaml
      - name: gitleaks (whole history)
        run: gitleaks git --config .gitleaks.toml --redact --report-path reports-gitleaks.json .
      - name: SHA256SUMS (fixture, audit report, fonts)
        run: node tools/testkit/run-suites.mjs checksums --report checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-supply-chain, path: "reports-*.json", if-no-files-found: ignore }

  reproducible-build-a:
    needs: toolchain
    if: needs.toolchain.outputs.repro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hash: ${{ steps.h.outputs.hash }}
      cid: ${{ steps.h.outputs.cid }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
        with: { kubo: "true" }
      - id: h
        name: build a → tree hash and IPFS CID
        run: |
          pnpm --filter @fondaco/client build
          out="$RUNNER_TEMP/web-a"; (cd apps/web && pnpm exec vite build --outDir "$out" --emptyOutDir)
          hash=$(node tools/build-hash.mjs "$out"); cid=$(node tools/ipfs.mjs cid "$out")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"; echo "cid=$cid" >> "$GITHUB_OUTPUT"
          echo "build a: $hash · $cid" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: web-build-a-manifest, path: reports/build-manifest.txt }

  reproducible-build-b:
    needs: toolchain
    if: needs.toolchain.outputs.repro == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hash: ${{ steps.h.outputs.hash }}
      cid: ${{ steps.h.outputs.cid }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      - uses: ./.github/actions/setup-toolchain
        with: { kubo: "true" }
      - id: h
        name: build b → tree hash and IPFS CID
        run: |
          pnpm --filter @fondaco/client build
          out="$RUNNER_TEMP/web-b"; (cd apps/web && pnpm exec vite build --outDir "$out" --emptyOutDir)
          hash=$(node tools/build-hash.mjs "$out"); cid=$(node tools/ipfs.mjs cid "$out")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"; echo "cid=$cid" >> "$GITHUB_OUTPUT"
          echo "build b: $hash · $cid" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: web-build-b-manifest, path: reports/build-manifest.txt }

  reproducible-compare:
    needs: [reproducible-build-a, reproducible-build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: same commit → same build (twice, separate jobs)
        env:
          HA: ${{ needs.reproducible-build-a.outputs.hash }}
          HB: ${{ needs.reproducible-build-b.outputs.hash }}
          CA: ${{ needs.reproducible-build-a.outputs.cid }}
          CB: ${{ needs.reproducible-build-b.outputs.cid }}
        run: |
          { echo "### Reproducible build"; echo; echo "| | tree hash | IPFS CID |"; echo "|---|---|---|"; echo "| build a | \`$HA\` | \`$CA\` |"; echo "| build b | \`$HB\` | \`$CB\` |"; echo; } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$HA" ] && [ "$HA" = "$HB" ] && [ -n "$CA" ] && [ "$CA" = "$CB" ] && echo "identical: $HA $CA" || { echo "builds differ"; exit 1; }

  docker:
    needs: toolchain
    if: needs.toolchain.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      smoke: ${{ steps.smoked.outputs.smoke }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.REF }}" }
      # D-62: with the containerd image store, `docker load` and `docker push` keep the image's own manifest, so the digest
      # tested here is the digest docker-publish pushes. Before setup-buildx: the restart would stop its builder.
      - name: Docker with the containerd image store
        run: |
          sudo sh -c 'f=/etc/docker/daemon.json; [ -s "$f" ] || echo "{}" > "$f"; jq ". + {\"features\": ((.features // {}) + {\"containerd-snapshotter\": true})}" "$f" > "$f.new" && mv "$f.new" "$f"'
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info -f '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter || { echo "::error::containerd image store not active"; exit 1; }
      - uses: ./.github/actions/setup-toolchain
        with: { foundry: "true", docker: "true" }
      - name: build the book image once, as an OCI archive (the same bytes are tested and, on a v* tag, published)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: deploy/book/Dockerfile
          provenance: false
          sbom: false
          outputs: "type=oci,dest=${{ runner.temp }}/book-image.oci.tar,name=fondaco-book:smoke"
          build-args: "VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}"
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
      - id: image
        name: load it; its digest is the manifest digest of the archive
        run: |
          tar="$RUNNER_TEMP/book-image.oci.tar"
          d=$(tar -xOf "$tar" index.json | jq -r '.manifests[0].digest')
          docker load -i "$tar"
          id=$(docker image inspect --format '{{.Id}}' fondaco-book:smoke)
          [ "$id" = "$d" ] || { echo "::error::loaded image $id differs from the archive manifest $d"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"; echo "$d" > "$RUNNER_TEMP/book-image.digest"
          echo "tested image: fondaco-book:smoke $d"
      - id: minio
        name: MinIO pins (tools/ci/toolchain.json → minio)
        run: node -e "const m=require('./tools/ci/toolchain.json').minio; for (const k of ['version','go','goImage','moduleSum','goSumSha256']) console.log(k + '=' + m[k])" >> "$GITHUB_OUTPUT"
      - id: minio-cache
        name: MinIO binary cache (key = release tag + Go version)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/minio
          key: "minio-${{ steps.minio.outputs.version }}-go${{ steps.minio.outputs.go }}"
      - name: build MinIO from the release tag (cache miss only; Go, module hash and go.sum pinned, D-58)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: >-
          docker buildx build deploy/minio --target bin --output type=local,dest=.cache/minio
          --build-arg "GO_IMAGE=${{ steps.minio.outputs.goImage }}" --build-arg "MINIO_VERSION=${{ steps.minio.outputs.version }}"
          --build-arg "GO_VERSION=${{ steps.minio.outputs.go }}" --build-arg "MINIO_MODULE_SUM=${{ steps.minio.outputs.moduleSum }}"
          --build-arg "MINIO_GOSUM_SHA256=${{ steps.minio.outputs.goSumSha256 }}"
      - name: MinIO image from the cached binary (never published)
        run: |
          docker build -f deploy/minio/Dockerfile.run --build-arg "MINIO_VERSION=${{ steps.minio.outputs.version }}" -t fondaco-minio:smoke .cache/minio
          { echo "### MinIO (backup smoke)"; echo; echo "cache: ${{ steps.minio-cache.outputs.cache-hit == 'true' && 'hit' || 'miss, built now' }} · $(cat .cache/minio/SOURCE)"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: compose smoke test (book + Caddy + backup over HTTPS; backups to the SigV4 stub and to MinIO)
        run: node tools/testkit/run-suites.mjs docker-smoke --report docker
      - id: smoked
        name: smoke passed on this image; a push to a local registry keeps its digest (the publish path, on every run)
        run: |
          d="${{ steps.image.outputs.digest }}"
          docker run -d --name run-registry -p 127.0.0.1:5055:5000 registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 >/dev/null
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5055/v2/ >/dev/null && break; sleep 1; done
          docker tag fondaco-book:smoke 127.0.0.1:5055/fondaco-book:probe && docker push 127.0.0.1:5055/fondaco-book:probe
          got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' 127.0.0.1:5055/fondaco-book:probe | jq -r .digest)
          docker rm -f run-registry >/dev/null
          [ "$got" = "$d" ] || { echo "::error::pushed digest $got differs from the tested $d"; exit 1; }
          echo "smoke=passed" >> "$GITHUB_OUTPUT"
          { echo "### Book image (tested)"; echo; echo "| image | digest | smoke | push keeps the digest |"; echo "|---|---|---|---|"
            echo "| \`fondaco-book:smoke\` | \`$d\` | passed | yes (local registry: \`$got\`) |"; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: keep the tested archive for docker-publish (v* tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: book-image-tested
          path: |
            ${{ runner.temp }}/book-image.oci.tar
            ${{ runner.temp }}/book-image.digest
          retention-days: 7
          if-no-files-found: error

  docker-publish:
    # D-62: only from a v* tag push and only with every verification job green (each one listed: a skipped or failed job
    # skips this one); it pushes the archive the docker job built and smoke-tested, never a new build
    needs: [toolchain, lint, unit, fork, foundry, web-e2e, supply-chain, reproducible-build-a, reproducible-build-b, reproducible-compare, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: the tagged commit must be on main (else fail, nothing is published)
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "$GITHUB_REF_NAME ($GITHUB_SHA) is on main"
          else echo "::error::tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not contained in main: not publishing"; exit 1; fi
      - name: the smoke test passed on the image to publish
        run: |
          [ "${{ needs.docker.outputs.smoke }}" = passed ] && [ -n "${{ needs.docker.outputs.digest }}" ] || { echo "::error::no smoke-tested image"; exit 1; }
      - name: Docker with the containerd image store (keeps the tested manifest on load and push)
        run: |
          sudo sh -c 'f=/etc/docker/daemon.json; [ -s "$f" ] || echo "{}" > "$f"; jq ". + {\"features\": ((.features // {}) + {\"containerd-snapshotter\": true})}" "$f" > "$f.new" && mv "$f.new" "$f"'
          sudo systemctl restart docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info -f '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter || { echo "::error::containerd image store not active"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: book-image-tested, path: "${{ runner.temp }}/book" }
      - id: ref
        name: load the tested archive; same digest as the smoke test, before anything is pushed
        run: |
          d="${{ needs.docker.outputs.digest }}"; tar="$RUNNER_TEMP/book/book-image.oci.tar"
          [ "$(cat "$RUNNER_TEMP/book/book-image.digest")" = "$d" ] || { echo "::error::artifact digest differs from the tested one"; exit 1; }
          [ "$(tar -xOf "$tar" index.json | jq -r '.manifests[0].digest')" = "$d" ] || { echo "::error::archive manifest differs from the tested one"; exit 1; }
          docker load -i "$tar"
          [ "$(docker image inspect --format '{{.Id}}' fondaco-book:smoke)" = "$d" ] || { echo "::error::loaded image differs from the tested one"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/fondaco-book" >> "$GITHUB_OUTPUT"; echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "digest=$d" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: push the tested image as ghcr.io/<owner>/fondaco-book:<git tag> and check the registry digest
        run: |
          ref="${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.tag }}"; d="${{ steps.ref.outputs.digest }}"
          docker tag fondaco-book:smoke "$ref" && docker push "$ref"
          got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$ref" | jq -r .digest)
          [ "$got" = "$d" ] || { echo "::error::registry digest $got differs from the tested $d"; exit 1; }
          { echo "### Image published"; echo; echo "| tag | digest | commit | smoke on this image |"; echo "|---|---|---|---|"
            echo "| \`$ref\` | \`$got\` | \`$GITHUB_SHA\` | passed (docker job, same digest) |"; echo
            echo "Copy this row into REPORT.md, section \"Immagine della bacheca\"."; echo; } >> "$GITHUB_STEP_SUMMARY"
